# 小鱼陪聊 Worker 配置
# 部署：wrangler deploy
name = "baoji-chat"
main = "index.js"
compatibility_date = "2026-10-01"

# 只接管 /api/chat，不影响现有的 /api/messages
[[routes]]
pattern = "baojijiaoyu86.top/api/chat"
zone_name = "baojijiaoyu86.top"

[vars]
MODEL = "deepseek-chat"
DAILY_LIMIT = "400"
RATE_LIMIT = "20"

# 可选：按 IP 限流（强烈建议开启）
# 先执行：wrangler kv namespace create CHAT_KV
# 再把返回的 id 填进来，并取消下面三行注释
# [[kv_namespaces]]
# binding = "CHAT_KV"
# id = "把 kv namespace 的 id 填这里"
