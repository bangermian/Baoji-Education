# 小鱼陪聊 Worker 配置
# 部署：wrangler deploy
name = "baoji-chat"
main = "index.js"
compatibility_date = "2026-10-01"

# 只接管 /api/chat，不影响现有的 /api/messages
[[routes]]
pattern = "baojijiaoyu86.top/api/chat"
zone_name = "baojijiaoyu86.top"

[vars]
MODEL = "deepseek-chat"
DAILY_LIMIT = "400"
RATE_LIMIT = "20"

# 按 IP 限流 + 全站每日总额（KV 已于 2026-10-28 创建）
[[kv_namespaces]]
binding = "CHAT_KV"
id = "d185d47812b841c68f85c27fdbb398e7"
