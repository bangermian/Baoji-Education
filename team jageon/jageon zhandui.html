<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team jageon战队</title>
    <link rel="icon" href="../favicon.ico?v=2" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #0c0d12;
            color: #e8e8e8;
        }
        /* 返回首页按钮 */
        .back-home {
            display: inline-block;
            margin: 20px;
            color: #0066cc;
            text-decoration: none;
        }
        .back-home:hover {
            text-decoration: underline;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #222;
            font-size: 28px;
        }
        /* 右上角切换按钮 */
        .switch-btn {
            position: fixed;
            right: 30px;
            top: 30px;
            padding: 12px 22px;
            background: #0066cc;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0,102,204,0.25);
            z-index: 998;
            transition: all 0.2s ease;
        }
        .switch-btn:hover {
            background-color: #004b99;
        }
        /* 头部横幅 */
        .banner {
            width: 70%;
            height: 65vh;
             /* 加这一行让banner盒子整体页面居中 */
            margin: 0 auto;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)), url("../img/team_jageon.jpg") center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .banner h1 {
            font-size: 54px;
            letter-spacing: 8px;
            margin-bottom: 15px;
            color: #fff;
        }
        .banner p {
            font-size: 19px;
            color: #bbbbbb;
        }
        /* 主体容器 */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 70px 20px;
        }
        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }
        .section-title h2 {
            font-size: 29px;
            color: #0099ff;
        }
        /* 战队介绍 */
        .intro-box {
            background: #1a1d25;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 70px;
        }
        .intro-box p {
            font-size: 16px;
            line-height: 2;
            color: #cccccc;
            text-indent: 2em;
        }
        /* 队员卡片区域 */
.player-list {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 28px;
    margin-bottom: 70px;
}
.player-card {
    background: #1a1d25;
    border-radius: 13px;
    overflow: hidden;
    transition: 0.3s;
    box-shadow: 0 2px 14px rgba(0,0,0,0.2);
}
.player-card:hover {
    transform: translateY(-7px);
    box-shadow: 0 8px 26px rgba(0,136,255,0.18);
}
.player-card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}
.player-info {
    padding: 15px;
    text-align: center;
}
.player-info h3 {
    font-size: 18px;
    margin-bottom: 5px;
}
.player-info span {
    color: #77aadd;
    font-size: 14px;
}

        /* 底部 */
        footer {
            text-align: center;
            padding: 30px;
            background: #121419;
            color: #888;
            font-size: 14px;
        }
        @media (max-width: 992px) {
        .player-list {
        grid-template-columns: repeat(2, 1fr);
        }
        }
        @media (max-width: 576px) {
        .player-list {
        grid-template-columns: repeat(1, 1fr);
        }
        }
    </style>
</head>
<body>
    <!-- 返回首页 -->
    <a href="../index.html" class="back-home">← 返回首页</a>

    <!-- 右上角切换按钮，修改href跳转对应页面 -->
    <a href="jageon.html" class="switch-btn">切换回豹鸡班</a>

    <div class="banner">
        <h1>Team jageon 战队</h1>
        <p>We are Team jageon!!!</p>
    </div>

    <div class="container">
        <div class="section-title">
            <h2>战队简介</h2>
        </div>
        <div class="intro-box">
            <p>Team jageon战队成立于2026年，是一支CS和MOBA游戏的业余战队。</p>
        </div>

        <div class="section-title">
            <h2>现役队员</h2>
        </div>
        <div class="player-list">
            <div class="player-card">
                <img src="../img/player1.jpg" alt="队长">
                <div class="player-info">
                    <h3>zhouyuhan20</h3>
                    <span>队长 / 指挥位</span>
                </div>
            </div>
            <div class="player-card">
                <img src="../img/player2.jpg" alt="突击手">
                <div class="player-info">
                    <h3>zhouyuhan20</h3>
                    <span>突击手</span>
                </div>
            </div>
            <div class="player-card">
                <img src="../img/player3.jpg" alt="狙击">
                <div class="player-info">
                    <h3>zhouyuhan20</h3>
                    <span>狙击手</span>
                </div>
            </div>
            <div class="player-card">
                <img src="../img/player4.jpg" alt="辅助">
                <div class="player-info">
                    <h3>Lorelei</h3>
                    <span>补枪手</span>
                </div>
            </div>
            <div class="player-card">
                <img src="../img/player5.jpg" alt="辅助">
                <div class="player-info">
                    <h3>Lorelei</h3>
                    <span>道具手</span>
                </div>
            </div>
        </div>
    </div>

    <footer>
        © 2026 Team jageon 版权所有 | baojijiaoyu86.top
    </footer>
</body>
</html>
